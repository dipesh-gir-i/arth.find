      var t = "warm-calm";
      try { var s = localStorage.getItem("arth-site-theme"); if (ids.indexOf(s) > -1) t = s; } catch (e) {}
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="styles.css">

<body>
  <a class="skip" href="#main">Skip to content</a>

      <div class="actions">

              <li><a href="https://www.linkedin.com/in/sahel-sasmal-8706b4332/">Sahel Sasmal</a></li>
              <li><a href="https://www.linkedin.com/in/nilesh-9683a42b8">Nilesh</a></li>
